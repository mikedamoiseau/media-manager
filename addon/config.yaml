# Home Assistant add-on. The image is built on GitHub (.github/workflows/addon.yml) when `version` changes,
# so Home Assistant pulls it instead of building it, and backups don't carry it.
name: Cinémathèque
version: "0.1.4"
slug: cinematheque
description: The films and series on the NAS, for the phone and the Kodi TVs.
url: https://github.com/mikedamoiseau/media-manager
arch:
  - amd64
image: ghcr.io/mikedamoiseau/media-manager-addon
startup: application
boot: auto
# The LAN as is: Kodi found by Bonjour, phones on port 8642, the TVs' live channels through the app.
# On the host network there is no port mapping: [PORT:8642] stays 8642.
host_network: true
webui: http://[HOST]:[PORT:8642]
# Restarted when the app stops answering (the Supervisor asks every 2 minutes, 10 s timeout), not only
# when it exits. /api/status answers from memory.
watchdog: http://[HOST]:[PORT:8642]/api/status
# media: the NAS share Home Assistant mounts, one mount for the media and the live-TV folders (see README).
# Its NAS account makes it read-only but for the live-TV folder.
# share (read-only): a library brought over, read once on the first start (see run.sh).
map:
  - media:rw
  - share
# Stopped for the backup: the SQLite library is then closed and whole.
backup: cold
# Caches the app fetches again.
backup_exclude:
  - img
  - thumbs
